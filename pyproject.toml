[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowcache-harness"
version = "0.1.0"
description = "A measurable, local-first compute reuse harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
flowcache = "flowcache.__main__:main"

[tool.setuptools.package-data]
flowcache = ["static/*"]

[tool.setuptools.packages.find]
include = ["flowcache*"]
