name: Claimweave import formatting

on:
  push:
    branches: [main]
    paths: ['.github/workflows/claimweave-import-format.yml']

permissions:
  contents: write

jobs:
  format-imported-tests:
    if: github.repository == 'superwesleyhys-ux/data-token'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: claimweave-4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked formatter without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply safe formatting only to imported tests
        run: ./node_modules/.bin/biome check --write tests
      - name: Commit formatting without overwriting concurrent work
        run: |
          git add -- tests
          if git diff --cached --quiet; then
            echo 'No formatting changes needed.'
            exit 0
          fi
          git diff --cached --stat
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Format imported Claimweave tests without changing assertions'
          git push origin HEAD:main
          git rev-parse HEAD
